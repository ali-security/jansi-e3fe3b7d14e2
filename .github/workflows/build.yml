name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rebuild every native library that contains the ioctl wrapper with the
  # upstream Makefile cross-compilation targets (the Windows DLLs do not).
  native:
    name: native ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ linux-x86, linux-x86_64, linux-arm, linux-armv6, linux-armv7, linux-arm64, linux-ppc64,
                  mac-x86, mac-x86_64, mac-arm64, freebsd-x86, freebsd-x86_64 ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cross-compile
        run: make ${{ matrix.target }}
      - name: Collect the rebuilt library
        run: |
          changed=$(git status --porcelain -- src/main/resources | awk '{print $2}')
          echo "$changed"
          test -n "$changed" && test "$(echo "$changed" | wc -l)" -eq 1
          mkdir -p native-out
          cp --parents "$changed" native-out/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-out/
          if-no-files-found: error

  test:
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel ]
        java: [ '8', '11', '17' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn test
        run: mvn -B --no-transfer-progress test

  package:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
      - name: Check that all 12 native libraries were rebuilt
        run: |
          git status --porcelain -- src/main/resources
          test "$(git status --porcelain -- src/main/resources | wc -l)" -eq 12
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: mvn package
        run: mvn -B --no-transfer-progress -Dgpg.skip=true package
      - uses: actions/upload-artifact@v4
        with:
          name: jansi-jar
          path: target/jansi-2.4.0.jar
          if-no-files-found: error
